<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Liturgical Emerald -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e4632" />
      <stop offset="70%" stop-color="#132c20" />
      <stop offset="100%" stop-color="#0a1912" />
    </radialGradient>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="25%" stop-color="#f5d061" />
      <stop offset="50%" stop-color="#d49b28" />
      <stop offset="75%" stop-color="#f9db7b" />
      <stop offset="100%" stop-color="#996c13" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a520a" />
      <stop offset="50%" stop-color="#eac665" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="holyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Base Circular Medallion -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" />
  
  <!-- Outer Beveled Gold Rim -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldBevel)" stroke-width="3" opacity="0.85" />
  
  <!-- Inner Fine Accent Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Holy Light Rays Behind Center -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25">
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="60" y1="256" x2="452" y2="256" />
    <line x1="117" y1="117" x2="395" y2="395" />
    <line x1="117" y1="395" x2="395" y2="117" />
  </g>

  <!-- Crown of Our Lady Queen of Peace -->
  <g id="marianCrown" fill="url(#goldGrad)" stroke="url(#goldBevel)" stroke-width="1" filter="url(#holyGlow)">
    <!-- Crown Base Band -->
    <path d="M186 168 C220 178 292 178 326 168 L320 182 C288 190 224 190 192 182 Z" />
    
    <!-- Crown Pearls on Band -->
    <circle cx="206" cy="178" r="3.5" fill="#ffffff" />
    <circle cx="231" cy="181" r="3.5" fill="#ffffff" />
    <circle cx="256" cy="182" r="4.5" fill="#ffffff" />
    <circle cx="281" cy="181" r="3.5" fill="#ffffff" />
    <circle cx="306" cy="178" r="3.5" fill="#ffffff" />

    <!-- 5 Crown Spires -->
    <!-- Center Spire (Tallest with Cross) -->
    <path d="M246 168 L256 122 L266 168 Z" />
    <circle cx="256" cy="118" r="4.5" fill="#ffffff" />
    <!-- Mini Cross atop Center Spire -->
    <path d="M253 96 H259 V114 H253 Z M247 101 H265 V106 H247 Z" />

    <!-- Mid Left Spire -->
    <path d="M214 171 L206 135 L228 171 Z" />
    <circle cx="205" cy="132" r="3.5" fill="#ffffff" />

    <!-- Mid Right Spire -->
    <path d="M298 171 L306 135 L284 171 Z" />
    <circle cx="307" cy="132" r="3.5" fill="#ffffff" />

    <!-- Outer Left Spire -->
    <path d="M188 168 L176 146 L198 170 Z" />
    <circle cx="175" cy="144" r="3" fill="#ffffff" />

    <!-- Outer Right Spire -->
    <path d="M324 168 L336 146 L314 170 Z" />
    <circle cx="337" cy="144" r="3" fill="#ffffff" />
  </g>

  <!-- Marian Monogram 'M' intertwined with Holy Cross -->
  <g id="marianMonogram" fill="url(#goldGrad)" stroke="url(#goldBevel)" stroke-width="1.5" filter="url(#holyGlow)">
    <!-- Stylized Marian 'M' -->
    <path d="M 148 350 
             C 142 320 156 270 178 220 
             C 192 188 206 186 216 200 
             C 226 214 240 252 256 295 
             C 272 252 286 214 296 200 
             C 306 186 320 188 334 220 
             C 356 270 370 320 364 350 
             C 358 375 338 375 334 355 
             C 330 330 318 275 304 245 
             L 274 320 
             C 268 334 244 334 238 320 
             L 208 245 
             C 194 275 182 330 178 355 
             C 174 375 154 375 148 350 Z" />
    
    <!-- Central Latin Cross of Salvation -->
    <!-- Vertical Beam -->
    <path d="M 249 190 
             L 263 190 
             L 263 360 
             L 249 360 Z" />
    <!-- Horizontal Crossbeam -->
    <path d="M 224 238 
             L 288 238 
             L 288 252 
             L 224 252 Z" />
    <!-- Cross Finial Accents (Trefoil style) -->
    <circle cx="256" cy="188" r="4.5" />
    <circle cx="221" cy="245" r="4.5" />
    <circle cx="291" cy="245" r="4.5" />
  </g>

  <!-- The Holy Rosary Wreath (Chuỗi Hạt Mân Côi) -->
  <g id="holyRosary" fill="url(#goldGrad)" stroke="url(#goldBevel)" stroke-width="0.8">
    <!-- Rosary Beads Garland Swagging Underneath -->
    <g id="rosaryBeads">
      <circle cx="162" cy="365" r="4.5" />
      <circle cx="178" cy="378" r="4.5" />
      <circle cx="196" cy="389" r="4.5" />
      <circle cx="216" cy="396" r="4.5" />
      <circle cx="236" cy="400" r="5.5" /> <!-- Decade Mystery Bead (Larger) -->
      
      <circle cx="256" cy="401" r="4.5" />
      
      <circle cx="276" cy="400" r="5.5" /> <!-- Decade Mystery Bead (Larger) -->
      <circle cx="296" cy="396" r="4.5" />
      <circle cx="316" cy="389" r="4.5" />
      <circle cx="334" cy="378" r="4.5" />
      <circle cx="350" cy="365" r="4.5" />
    </g>

    <!-- Center Rosary Pendant Ribbon & Miniature Crucifix -->
    <g id="rosaryCrucifix" filter="url(#holyGlow)">
      <!-- Connecting Center Bead -->
      <circle cx="256" cy="414" r="5" />
      <circle cx="256" cy="426" r="4" />
      
      <!-- Pendant Crucifix -->
      <path d="M 253 435 H 259 V 472 H 253 Z" />
      <path d="M 244 445 H 268 V 450 H 244 Z" />
      <!-- Cross Tips -->
      <circle cx="256" cy="434" r="2.5" />
      <circle cx="243" cy="447.5" r="2.5" />
      <circle cx="269" cy="447.5" r="2.5" />
      <circle cx="256" cy="473" r="2.5" />
    </g>
  </g>

  <!-- Delicate Marian Rosary Stars (12 Stars) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <polygon points="256,42 258,48 264,48 259,52 261,58 256,54 251,58 253,52 248,48 254,48" />
    <polygon points="172,66 174,72 180,72 175,76 177,82 172,78 167,82 169,76 164,72 170,72" />
    <polygon points="340,66 342,72 348,72 343,76 345,82 340,78 335,82 337,76 332,72 338,72" />
    <polygon points="106,128 108,134 114,134 109,138 111,144 106,140 101,144 103,138 98,134 104,134" />
    <polygon points="406,128 408,134 414,134 409,138 411,144 406,140 401,144 403,138 398,134 404,134" />
  </g>
</svg>
