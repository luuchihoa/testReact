    <path d="M172 74 C175 79 175 82 172 87 C169 82 169 79 172 74 Z"/>
    <!-- 2 ngọn lửa tầng 4 -->
    <path d="M78 104 C81 108 80 111 76 116 C74 111 75 108 78 104 Z"/>
    <path d="M178 104 C181 108 180 111 176 116 C174 111 175 108 178 104 Z"/>
