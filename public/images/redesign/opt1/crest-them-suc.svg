      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <linearGradient id="opt1-gold-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B76A"/>
      <stop offset="50%" stop-color="#B88A34"/>
      <stop offset="100%" stop-color="#8C631B"/>
