<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg-kt-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="60%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="gold-cross-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leaf-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow-kt-b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Modern Squircle (Khăn Xanh Lá Trơn) -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bg-kt-b)" stroke="#10B981" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="81" height="81" rx="21" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Vầng Thái Dương Soi Sáng Mầm Đức Tin -->
  <circle cx="48" cy="38" r="25" fill="#FEF9C3" opacity="0.85"/>
  <circle cx="48" cy="38" r="21" fill="none" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Vầng Hào Quang Thánh Thiện Rạng Ngời -->
  <g stroke="#FACC15" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <line x1="48" y1="11" x2="48" y2="17"/>
    <line x1="30" y1="20" x2="35" y2="24"/>
    <line x1="66" y1="20" x2="61" y2="24"/>
    <line x1="22" y1="38" x2="27" y2="38"/>
    <line x1="74" y1="38" x2="69" y2="38"/>
  </g>

  <!-- Thánh Giá Hoa Nở (Thập Giá Cứu Độ Ở Trung Tâm Bầu Trời) -->
  <g filter="url(#shadow-kt-b)">
    <rect x="45.5" y="16" width="5" height="30" rx="2.5" fill="url(#gold-cross-b)" stroke="#854D0E" stroke-width="1.2"/>
    <rect x="36" y="24" width="24" height="5" rx="2.5" fill="url(#gold-cross-b)" stroke="#854D0E" stroke-width="1.2"/>
    <!-- Nụ Hoa Thánh Giá 4 Góc -->
    <circle cx="48" cy="26.5" r="2.8" fill="#FEF08A" stroke="#854D0E" stroke-width="0.8"/>
  </g>

  <!-- Đồi Đất Phù Sa & Vườn Ươm Giáo Xứ -->
  <path d="M8 82 C26 72 70 72 88 82 V86 H8 Z" fill="#047857" opacity="0.3"/>
  <path d="M8 83 C28 75 68 75 88 83" stroke="#065F46" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mầm Cây Đức Tin (Sprout of Faith) 2 Lá Non Đầy Sức Sống -->
  <g filter="url(#shadow-kt-b)">
    <!-- Thân Mầm Non Xanh Uốn Cong Mềm Mại -->
    <path d="M48 82 C48 68 47 56 48 48" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Lá Trái: Vươn Lên Đầy Hy Vọng -->
    <path d="M48 64 C32 60 22 46 36 40 C46 44 48 54 48 64 Z" 
          fill="url(#leaf-grad-1)" stroke="#064E3B" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Gân lá trái -->
    <path d="M48 62 C40 56 36 50 36 42" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

    <!-- Lá Phải: Đón Nhận Hồng Ân Chúa -->
    <path d="M48 56 C64 52 74 38 60 32 C50 36 48 46 48 56 Z" 
          fill="url(#leaf-grad-2)" stroke="#064E3B" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Gân lá phải -->
    <path d="M48 54 C56 48 60 42 60 34" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

    <!-- Giọt Sương Ân Sủng Long Lanh -->
    <circle cx="36" cy="40" r="2.2" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
  </g>
</svg>
