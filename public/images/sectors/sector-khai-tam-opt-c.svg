<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg-kt-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="60%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="gold-cross-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow-kt-c" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Modern Squircle (Khăn Xanh Lá Trơn) -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bg-kt-c)" stroke="#10B981" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="81" height="81" rx="21" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Vầng Thái Dương Hào Quang -->
  <circle cx="48" cy="34" r="22" fill="#FEF9C3" opacity="0.9"/>
  <circle cx="48" cy="34" r="18" fill="none" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="2 2.5"/>

  <!-- Thánh Giá Vàng Kim Ở Đỉnh -->
  <g filter="url(#shadow-kt-c)">
    <rect x="45.5" y="14" width="5" height="24" rx="2.5" fill="url(#gold-cross-c)" stroke="#854D0E" stroke-width="1"/>
    <rect x="38" y="20" width="20" height="5" rx="2.5" fill="url(#gold-cross-c)" stroke="#854D0E" stroke-width="1"/>
    <circle cx="48" cy="22.5" r="2" fill="#FEF08A"/>
  </g>

  <!-- Đồi Cỏ Non -->
  <path d="M8 82 C28 72 68 72 88 82 V86 H8 Z" fill="#34D399" opacity="0.35"/>
  <path d="M8 84 C30 76 66 76 88 84" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bông Hoa Huệ Trắng Tinh Khiết Của Tuổi Thơ Đơn Sơ -->
  <g filter="url(#shadow-kt-c)">
    <!-- Thân cuống hoa xanh non -->
    <path d="M48 84 V56" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Hai lá non xanh ngọc hai bên cuống -->
    <path d="M48 72 C36 70 30 62 36 56 C44 58 48 64 48 72 Z" fill="#10B981" stroke="#064E3B" stroke-width="1.8"/>
    <path d="M48 68 C60 66 66 58 60 52 C52 54 48 60 48 68 Z" fill="#34D399" stroke="#064E3B" stroke-width="1.8"/>

    <!-- 3 Cánh Hoa Huệ Trắng Tinh Tuyền Bung Nở Đón Ơn Chúa -->
    <!-- Cánh trái uốn cong mềm mại -->
    <path d="M48 58 C38 52 30 38 34 34 C44 38 46 48 48 58 Z" fill="#FFFFFF" stroke="#064E3B" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Cánh phải uốn cong mềm mại -->
    <path d="M48 58 C58 52 66 38 62 34 C52 38 50 48 48 58 Z" fill="#FFFFFF" stroke="#064E3B" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Cánh giữa vươn thẳng lên Thánh Giá -->
    <path d="M48 58 C42 46 42 32 48 28 C54 32 54 46 48 58 Z" fill="#FFFFFF" stroke="#064E3B" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Nhụy Hoa Vàng Phấn Ngát Hương -->
    <circle cx="48" cy="42" r="2.2" fill="#EAB308"/>
    <circle cx="44" cy="40" r="1.6" fill="#FACC15"/>
    <circle cx="52" cy="40" r="1.6" fill="#FACC15"/>
  </g>
</svg>
